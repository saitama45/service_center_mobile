# Builds, signs and uploads the Android App Bundle to Google Play.
#
# Release: bump `version:` in pubspec.yaml (name AND build number), commit, then
#   git tag v1.0.3 && git push origin master v1.0.3
# The tag must equal the pubspec version name, and the build number (+N) is the
# Play version code — it must be higher than any bundle Play has seen, or the
# upload is refused. A tag goes to Closed testing (Alpha); "Run workflow" in the
# Actions tab can pick another track.
#
# Built with no --dart-define, so ApiClient uses its production default.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of android/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD  storePassword from android/key.properties
#   ANDROID_KEY_PASSWORD       keyPassword
#   ANDROID_KEY_ALIAS          keyAlias
#   PLAY_SERVICE_ACCOUNT_JSON  JSON key of a service account invited in Play
#                              Console with permission to release this app
name: Play release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        default: alpha
        options: [internal, alpha, production]

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Check the tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          name=${version%%+*}
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi
          echo "Releasing $version"

      - run: flutter pub get

      # The unit suite opens in-memory SQLite through the host's libsqlite3.
      - run: sudo apt-get install -y libsqlite3-dev

      - run: flutter test

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.coffeebean.cbtl
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'alpha' }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
