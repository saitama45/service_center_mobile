name: cbtl
description: Coffee Bean & Tea Leaf loyalty and service mobile application.
version: 1.0.1+5
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Local Database (Drift = type-safe SQLite ORM)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure Storage (session tokens — Android Keystore + iOS Keychain)
  flutter_secure_storage: ^9.2.2

  # Password Hashing (pure Dart, no native bindings)
  bcrypt: ^1.1.3

  # Utilities
  uuid: ^4.4.0
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  crypto: ^3.0.3
  http: ^1.6.0

  # Loyalty
  qr_flutter: ^4.1.0 # renders the member's rotating scan token
  local_auth: ^2.3.0 # Face ID / fingerprint unlock

  # UI
  url_launcher: ^6.3.0 # opens the web account-deletion and password-reset pages
  in_app_update: ^5.0.0 # Play Store "update available" prompt (Android only)
  package_info_plus: ^9.0.1 # installed version shown on Splash + Profile

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.jpg"
  min_sdk_android: 21 # android min sdk min:16, default:21
  # Android 8+ masks legacy icons into a pale circle; adaptive layers keep the
  # brand purple edge-to-edge. Background matches the logo's own #5C3875.
  adaptive_icon_background: "#5C3875"
  adaptive_icon_foreground: "assets/images/app_logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    # Body / UI typeface
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    # Display / heading typeface
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    # Numerals, IDs, timestamps
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
