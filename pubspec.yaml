name: bms
description: Bridge Management System — DPWH Mobile Application
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Local Database (Drift = type-safe SQLite ORM)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure Storage (session tokens — Android Keystore + iOS Keychain)
  flutter_secure_storage: ^9.2.2

  # Password Hashing (pure Dart, no native bindings)
  bcrypt: ^1.1.3

  # Utilities
  uuid: ^4.4.0
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  crypto: ^3.0.3

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  image_picker: ^1.2.1
  camera: ^0.11.0+2
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.2
  image: ^4.8.0
  screenshot: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo_v2.png"
  min_sdk_android: 21 # android min sdk min:16, default:21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
